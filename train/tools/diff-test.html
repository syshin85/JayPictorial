<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>틀린그림찾기 테스트</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../diff.css">
<style>
  .all { padding: 10px; display: grid; gap: 10px; font: 13px -apple-system, sans-serif; }
  .pair { display: flex; gap: 8px; align-items: flex-start; background: #fff; padding: 6px; border-radius: 8px; }
  .pair b { width: 130px; flex: none; }
  .pair svg { width: 400px; height: 300px; background: #ddd; }
</style>
</head>
<body>
<main id="app"></main>
<script src="../diff.js"></script>
<script>
  // ?all=1 renders generated pairs with their hit circles outlined (8 random trains, ?n=16 for more,
  // or ?ids=ktx,srt for specific ones). Without it, the real game is mounted.
  const q = new URLSearchParams(location.search);
  const app = document.getElementById("app");
  if (q.get("all")) {
    app.className = "all";
    DiffGame.loadData().then(async ({ trains, media }) => {
      const ids = q.get("ids");
      let list = ids ? ids.split(",").map((id) => trains.find((t) => t.id === id)).filter(Boolean)
        : trains.filter((t) => DiffGame.photoOf(media, t)).sort(() => Math.random() - 0.5).slice(0, Number(q.get("n")) || 8);
      for (const t of list) {
        const row = document.createElement("div");
        row.className = "pair";
        app.appendChild(row);
        try {
          const p = await DiffGame.makePuzzle(t, DiffGame.photoOf(media, t));
          const marks = p.spots.map((s) => `<circle cx="${s.cx}" cy="${s.cy}" r="${s.r}" fill="none" stroke="#f0f" stroke-width="3" stroke-dasharray="8 6"/>
            <text x="${s.cx}" y="${s.cy - s.r - 6}" fill="#f0f" font-size="22" text-anchor="middle">${DiffGame.KIND_LABEL[s.kind]} ${s.change}</text>`).join("");
          row.innerHTML = `<b>${t.name}<br><small>${t.id}</small></b>` + [p.left, p.right].map((h) =>
            `<svg viewBox="0 0 800 600"><image href="${h}" width="800" height="600"/>${marks}</svg>`).join("");
        } catch (e) {
          row.innerHTML = `<b>${t.name}<br><small>${t.id}</small></b> ❌ ${e.message}`;
        }
      }
      document.title = "done";
    });
  } else {
    DiffGame.mount(app);
  }
</script>
</body>
</html>
