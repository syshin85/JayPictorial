<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 후보 검토</title>
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; margin: 0; padding: 8px; background: #f2f2f2; font-size: 11px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; background: #fff; border-radius: 8px; padding: 6px; margin-bottom: 6px; }
  .name { width: 90px; flex: none; font-weight: 700; font-size: 13px; }
  .name small { display: block; font-weight: 400; color: #888; font-size: 10px; }
  .v { width: 150px; flex: none; }
  .v.cur { outline: 3px solid #2a7; outline-offset: 1px; border-radius: 4px; }
  .frames { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; position: relative; }
  .frames img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #ccc; }
  .frames b { position: absolute; top: 2px; left: 2px; background: #000c; color: #fff; font-size: 13px; padding: 0 5px; border-radius: 3px; }
  .t { height: 2.6em; overflow: hidden; line-height: 1.3; margin-top: 2px; }
</style>
</head>
<body>
<div id="list"></div>
<script>
// Rows from tools/video_picker.py find. #0 (green) is the current video; the three frames are
// YouTube's captures from the start, middle and end of each video.
const ids = new URLSearchParams(location.search).get("ids");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const file = new URLSearchParams(location.search).get("file") || "videos";
fetch(`candidates/${file}.json?v=${Date.now()}`).then((r) => r.json()).then((data) => {
  const keys = ids ? ids.split(",") : Object.keys(data);
  document.getElementById("list").innerHTML = keys.filter((k) => data[k]).map((k) => `
    <div class="row"><div class="name">${esc(data[k].name)}<small>${k}</small></div>
      ${data[k].candidates.map((c, i) => c.youtube ? `
        <div class="v ${i === 0 ? "cur" : ""}">
          <div class="frames"><b>${i}</b>${[1, 2, 3].map((f) => `<img src="https://i.ytimg.com/vi/${esc(c.youtube)}/hq${f}.jpg" alt="">`).join("")}</div>
          <div class="t">${c.seconds ? Math.floor(c.seconds / 60) + ":" + String(c.seconds % 60).padStart(2, "0") + " " : ""}${esc(c.title)}</div>
        </div>` : "").join("")}
    </div>`).join("");
});
</script>
</body>
</html>
